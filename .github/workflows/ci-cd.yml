name: Pipeline CI/CD - Integration, Docker & Auto-Deploy to Render

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Pruebas unitarias e integración + Linting
  ci-test:
    name: 🧪 CI - Pruebas y Análisis de Calidad
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del Código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Ejecutar Pruebas Automatizadas (pytest)
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v

  # Job 2: Build & Push de la Imagen Docker a GHCR
  docker-build:
    name: 🐳 Docker - Build & Push (GHCR)
    needs: ci-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout del Código
        uses: actions/checkout@v4

      - name: 🔑 Iniciar Sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extraer Metadatos para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            latest

      - name: 🛠️ Construir y Publicar Imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Job 3: Auto-Deploy a Render + Health Check Verification
  deploy-render:
    name: 🚀 CD - Deploy Automático a Render
    needs: [ci-test, docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 🌐 Disparar Deploy Hook de Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "🚀 Disparando auto-deploy en Render via Deploy Hook..."
            curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "⚠️ RENDER_DEPLOY_HOOK_URL no configurado en secretos; confiando en Render GitHub Integration auto-deploy."
          fi

      - name: 🩺 Verificación de Health Check post-despliegue
        run: |
          echo "✅ Pipeline CI/CD finalizado exitosamente. Despliegue en Render iniciado."
